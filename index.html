<style>
:root{--bg:#f3f6f9;--panel:#fff;--ink:#14202e;--sub:#5a6b7d;--line:#d6dee7;--pri:#1b4a7a;--hit:#e6f0fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--panel:#16222f;--ink:#e8eef5;--sub:#9fb0c1;--line:#2a3a4b;--pri:#6fa8dc;--hit:#1c3247}}
:root[data-theme="dark"]{--bg:#0e1620;--panel:#16222f;--ink:#e8eef5;--sub:#9fb0c1;--line:#2a3a4b;--pri:#6fa8dc;--hit:#1c3247}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:34px 0 12px}
.lead{color:var(--sub);margin:0;max-width:60ch}
.news{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.news img{width:100%;height:auto;display:block;border-radius:6px;background:var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 260px;min-width:0;padding:11px 14px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px}
.bar button,.card{font:inherit;color:inherit}
.bar button{padding:11px 16px;background:var(--pri);color:var(--panel);border:0;border-radius:6px;cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
#count{font-weight:700;margin:12px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:6px;padding:14px 16px;cursor:pointer}
.card[aria-pressed="true"]{background:var(--hit)}
.card b{display:block;font-size:19px}
.card .n{font-size:26px;font-weight:700;color:var(--pri)}
.card small{display:block;color:var(--sub)}
.note{color:var(--sub);font-size:13px;margin:10px 0 0}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--sub)}
tr:last-child td{border-bottom:0}
.empty{padding:22px;color:var(--sub)}
@media (max-width:640px){.news{grid-template-columns:repeat(2,1fr)}}

<img src="images/카드뉴스3.png" width="1080" height="1080" alt="카드뉴스 3: 교통안전 - 신호 준수 캠페인, 방어운전 교육, 어르신 보행자 보호">

<button type="button" id="reset">전체 보기</button>

<p id="count" aria-live="polite"></p>
<div class="cards" id="cards"></div>
<p class="note">대표 문의기관은 카테고리에서 가장 많이 나온 기관이며, 동률이면 목록에서 먼저 나오는 기관입니다. 카드를 누르면 해당 카테고리로 검색됩니다.</p>

const $ = id => document.getElementById(id);
const cats = [...new Set(DATA.map(d => d.카테고리))];
function rep(rows){ // 최다 문의기관, 동률이면 먼저 나온 기관
  const m = new Map();
  rows.forEach(r => m.set(r.문의기관, (m.get(r.문의기관) || 0) + 1));
  let best = "", n = 0;
  for (const [k, v] of m) if (v > n) { best = k; n = v; }
  return best;
}
function render(){
  const q = $("q").value.trim().toLowerCase();
  const hit = d => !q || d.카테고리.toLowerCase().includes(q) || d.문의기관.toLowerCase().includes(q);
  const rows = DATA.filter(hit);
  $("count").textContent = "결과 " + rows.length + "건";
  $("cards").innerHTML = cats.map(c => {
    const all = DATA.filter(d => d.카테고리 === c), m = all.filter(hit).length;
    if (!m) return "";
    const on = q && q === c.toLowerCase();
    return '<button type="button" class="card" data-c="' + c + '" aria-pressed="' + !!on + '"><b>' + c +
      '</b><span class="n">' + all.length + '건</span><small>대표 문의기관 ' + rep(all) + '</small>' +
      (q ? '<small>검색 일치 ' + m + '건</small>' : '') + '</button>';
  }).join("");
  $("rows").innerHTML = rows.map(d => "<tr><td>" + d.서비스ID + "</td><td>" + d.서비스명 + "</td><td>" + d.카테고리 +
    "</td><td>" + d.문의기관 + "</td><td>" + d.온라인안내 + "</td><td>" + d.콜센터 + "</td></tr>").join("");
  $("empty").hidden = rows.length > 0;
}
$("q").addEventListener("input", render);
$("reset").addEventListener("click", () => { $("q").value = ""; render(); });
$("cards").addEventListener("click", e => {
  const b = e.target.closest(".card");
  if (b) { $("q").value = b.dataset.c; render(); }
});
render();
